name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify repository, build, and tests
        shell: pwsh
        run: ./scripts/verify.ps1 -Configuration Debug
